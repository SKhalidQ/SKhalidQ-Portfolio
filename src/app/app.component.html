<main appDisableRightClick appDisableTextSelection [class]="themeService.themeMode$ | async">
  <mat-drawer-container class="container" autosize>
    <mat-drawer #drawer [class]="themeService.themeMode$ | async" mode="over">
      <app-sidenav (toggle)="drawer.toggle()"></app-sidenav>
    </mat-drawer>

    <app-header (toggle)="drawer.toggle()"></app-header>

    <main>
      <router-outlet></router-outlet>
    </main>

  </mat-drawer-container>
</main>
