<div [class.lightTheme]="themeModes.themeMode$ | async">
  <mat-drawer-container class="container" autosize>
    <mat-drawer #sideNav role="navigation" class="sideNav" mode="over">
      <app-side-nav-list (closeSNav)="sideNav.close()"></app-side-nav-list>
    </mat-drawer>
    
    <app-header (toggle)="sideNav.toggle()"></app-header>
    
    <section *ngIf="progress">
      <mat-progress-bar mode="indeterminate" ></mat-progress-bar>
    </section>
    <main style="overflow: auto;">
      <router-outlet></router-outlet>
    </main>
  </mat-drawer-container>
</div>
