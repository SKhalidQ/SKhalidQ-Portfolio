<div class="container">
    <div class="main">
        <h1 class="title">{{ homeData.Title }}</h1>
    
        <div class="cv-container">
            <img [src]="themeService.themeMode.value == 'LightMode' ? lightCV : darkCV" alt="" class="cv-preview" onerror="this.src='../../assets/Images/error_outline-14px.svg'">
    
            <h3 class="cv-description">
                {{ homeData.CVText }}
                <button mat-raised-button color="basic" [routerLink]="routeData[0].route">{{ routeData[0].btnText }}</button>
            </h3>
        </div>
    
        <div class="project-container">
            <img [src]="themeService.themeMode.value == 'LightMode' ? lightProject : darkProject" alt="" class="project-preview" onerror="this.src='../../assets/Images/error_outline-14px.svg'">
    
            <h3 class="card-description">
                {{ homeData.ProjectText }}
                <button mat-raised-button color="basic" [routerLink]="routeData[1].route">{{ routeData[1].btnText }}</button>
            </h3>
        </div>
    </div>
</div>
