<div [class]="themeService.themeMode$ | async">
  <mat-drawer-container class="container" autosize>
    <mat-drawer #drawer [class]="themeService.themeMode$ | async" mode="over">
      <app-side-nav (toggle)="drawer.toggle()"></app-side-nav>
    </mat-drawer>
  
    <app-header (toggle)="drawer.toggle()"></app-header>

    <main>
      <router-outlet></router-outlet>
    </main>
  
  </mat-drawer-container>
</div>
