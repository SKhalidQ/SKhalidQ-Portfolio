<mat-card class="card">
    <mat-card-header>
      <div mat-card-avatar class="header-image"><mat-icon color="warn" style="font-size: 40px;">{{ project.icon }}</mat-icon></div>
      <mat-card-title>{{ project.title }}</mat-card-title>
      <!-- Once everything is completed, remove the h5 tag -->
      <mat-card-subtitle><h5>{{ project.subtitle }}</h5></mat-card-subtitle>
    </mat-card-header>
    <div class="projectPreviewImage">
  
    </div>
    <!-- <img mat-card-image *ngIf="item.image != null" [src]="item.image" alt="A preview image of the project"> -->
    <img mat-card-image *ngIf="project.image != null" [src]="project.image" alt="A preview image of the project" loading="lazy">
    <div class="notFoundDiv" *ngIf="project.image == null">
      <mat-icon class="noImage" color="warn" [inline]="true">error_outline</mat-icon>
    </div>
    <mat-card-content>
      <p> {{ project.description }} </p>
    </mat-card-content>
    <mat-card-actions style="margin-left: 0px; margin-right: 0px;">
      <a class="button" mat-flat-button color="warn" [href]="project.websiteURL" [disabled]="!project.website">Go</a>
      <div class="github">
        <a mat-icon-button [href]="project.githubURL" style="width: 37px;" [disabled]="!project.publicRepo"
          [matTooltip]="GetTooltipText(project.publicRepo)" matTooltipShowDelay="600" matTooltipClass="toolTip" class="githubLink"
          alt="Github Link" target="_blank">
          <img style="width: 36px;" [src]="githubService.githubLogo$ | async">
        </a>
      </div>
    </mat-card-actions>
  </mat-card>
